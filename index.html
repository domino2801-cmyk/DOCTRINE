<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2240" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>DOCTRINE | BM4</title>
    <style>
      :root {
        --navy: #0b2240;
        --red: #a82025;
        --bg: #f3f6fb;
        --text: #1d2430;
        --muted: #526075;
        --card: #ffffff;
        --shadow: rgba(11, 34, 64, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 18px 50px var(--shadow);
        border: 1px solid rgba(11, 34, 64, 0.08);
        overflow: hidden;
      }

      .header {
        background: var(--navy);
        color: white;
        padding: 22px 30px;
        border-bottom: 5px solid var(--red);
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .content {
        padding: 30px;
      }

      .hero-heading {
        display: flex;
        align-items: center;
      }

      .badge {
        display: inline-block;
        background: rgba(168, 32, 37, 0.08);
        color: var(--red);
        border: 1px solid rgba(168, 32, 37, 0.18);
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h2 {
        margin: 18px 0 12px;
        color: var(--navy);
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.04rem;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: var(--red);
        color: white;
        box-shadow: 0 12px 24px rgba(168, 32, 37, 0.22);
      }

      .button.secondary {
        background: #edf3ff;
        color: var(--navy);
        border: 1px solid rgba(11, 34, 64, 0.1);
      }

      .meta {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid rgba(11, 34, 64, 0.08);
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 600px) {
        .content { padding: 22px 18px 26px; }
        .header { padding: 18px 20px; }
        .brand-header { align-items: flex-start; }
        .hero-heading { align-items: flex-start; }
        .actions { flex-direction: column; }
        .button { width: 100%; }
      }
    </style>
    <link rel="stylesheet" href="splash/splash.css" />
    <link rel="stylesheet" href="auth/auth.css" />
    <script src="auth/auth.js"></script>
  </head>
  <body>
    <div id="splash" role="presentation" aria-hidden="true">
      <div class="stage">
        <svg class="boussole-fond" viewBox="-100 -100 200 200" aria-hidden="true">
          <g fill="none" stroke="#e5c158" stroke-width="0.6">
            <circle r="96"/><circle r="90" stroke-width="0.3"/><circle r="62" stroke-dasharray="1.5 3"/>
            <circle r="38" stroke-width="0.4"/>
            <g class="graduations" stroke-width="0.5"></g>
          </g>
          <path d="M0 -92 L7 0 L0 92 L-7 0 Z" fill="#e5c158" opacity="0.55"/>
          <path d="M-92 0 L0 -7 L92 0 L0 7 Z" fill="#e5c158" opacity="0.35"/>
          <path d="M0 -70 L4 -4 L70 0 L4 4 L0 70 L-4 4 L-70 0 L-4 -4 Z" transform="rotate(45)" fill="#e5c158" opacity="0.4"/>
        </svg>
        <img src="splash/lame.png" class="outil lame" alt="" />
        <img src="splash/boussole.png" class="outil boussole" alt="" />
        <img src="splash/cle.png" class="outil cle" alt="" />
        <img src="splash/scie.png" class="outil scie" alt="" />
        <img src="splash/regle.png" class="outil regle" alt="" />
        <div class="manche">
          <img src="splash/manche.png" alt="" />
          <span class="reflet"></span>
        </div>
        <div class="etincelles"></div>
        <div class="ui-loader">
          <div class="titre-app">COUTEAU SUISSE BM4</div>
          <div class="barre-chargement"><div class="progression"></div></div>
        </div>
      </div>
    </div>
    <script src="splash/splash.js"></script>
    <div class="shell">
      <main class="card" aria-label="Page d'accueil DOCTRINE">
        <header class="header">
          <div class="brand-header">
            <h1>DOCTRINE</h1>
          </div>
        </header>

        <div class="content">
          <span class="badge">BM4</span>
          <div class="hero-heading">
            <h2>Le couteau suisse du candidat</h2>
          </div>

          <div class="actions">
            <a class="button primary" href="./INDEX%20BM4V2.HTML">Ouvrir l'application</a>
          </div>

          <div class="meta">
            Application disponible sur desktop, mobile et installation PWA.
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
