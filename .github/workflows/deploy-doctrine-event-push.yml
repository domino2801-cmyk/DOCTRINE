name: Deploy DOCTRINE push Edge Function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/doctrine-event-push/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-doctrine-event-push.yml"
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy doctrine-event-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le secret GitHub SUPABASE_ACCESS_TOKEN est absent."
            exit 1
          fi
          supabase functions deploy doctrine-event-push --project-ref beodiemzrunqjkvylffn --yes
