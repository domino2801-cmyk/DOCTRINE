name: Deploy DOCTRINE authentication handoff

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/doctrine-auth-handoff/**"
      - "supabase/migrations/20261127170000_doctrine_auth_handoffs.sql"
      - "supabase/config.toml"
      - ".github/workflows/deploy-doctrine-auth-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply one-time handoff table migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Le secret GitHub SUPABASE_DB_PASSWORD est absent. Ajoutez le mot de passe de la base Supabase avant le déploiement."
            exit 1
          fi
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "host=db.beodiemzrunqjkvylffn.supabase.co port=5432 dbname=postgres user=postgres sslmode=require" -v ON_ERROR_STOP=1 -f supabase/migrations/20261127170000_doctrine_auth_handoffs.sql
      - name: Deploy authentication handoff Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le secret GitHub SUPABASE_ACCESS_TOKEN est absent."
            exit 1
          fi
          supabase functions deploy doctrine-auth-handoff --project-ref beodiemzrunqjkvylffn --yes
